<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Unavailable</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f7;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    .icon {
      font-size: 3.5rem;
      color: #bbb;
      margin-bottom: 1.5rem;
      line-height: 1;
    }

    h1 {
      font-size: 2rem;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 0.4rem;
      letter-spacing: -0.5px;
      line-height: 1.25;
    }

    .subline {
      font-size: 1rem;
      color: #888;
      margin-bottom: 2rem;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: #ddd;
      margin: 0 auto 2rem;
    }

    .blurb {
      font-size: 0.875rem;
      color: #aaa;
      line-height: 1.75;
    }

    .blurb a {
      color: #888;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .blurb a:hover {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true">⚡</div>
    <h1>This site is no longer in service.</h1>
    <p class="subline">The page you're looking for is unavailable.</p>
    <div class="divider"></div>
    <p class="blurb">
      Any inquiries, questions, or comments should be emailed directly
      to the site holder at
      <a href="mailto:celebwinemonthly@gmail.com">celebwinemonthly@gmail.com</a>
    </p>
  </div>
</body>
</html>
